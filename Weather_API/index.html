<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Weather API</title>
    <link rel="stylesheet" href="src/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="shortcut icon" href="assets/weather.png" type="image/x-icon">
</head>
<body>
    <div id="weather-container">
        <div id="searchBar">
                <input type="text" id="searchInput" placeholder="Search City/Country">
                <button onclick="loadWeather()" id="searchIcon"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></i></button>
        </div>

        <div id="info">
            <h3 id="city" class="cities"></h3>
            <h3 id="date" class="cities"></h3>
        </div>

        <div id="iconTemp"></div>

        <div id="temp-info">
            <div>
                <h3>Temp</h3>
                <h3 id="temp" class="changeSize"></h3>
            </div>
            <div>
                <h3>Main</h3>
                <h3 id="main" class="changeSize"></h3>
            </div>
        </div>

        <div id="wind">
            <div>
                <h3>Deg</h3>
                <h3 id="deg" class="changeSize"></h3>
            </div>
            <div>
                <h3>Speed</h3>
                <h3 id="speed" class="changeSize"></h3>
            </div>
        </div>

        <div id="min-max">
            <div>
                <h3>Min</h3>
                <h3 id="tempMin" class="changeSize"></h3>
            </div>
            <div>
                <h3>Max</h3>
                <h3 id="tempMax" class="changeSize"></h3>
            </div>
        </div>
    </div>
</body>
    <script src="src/api.js"></script>
</html>
